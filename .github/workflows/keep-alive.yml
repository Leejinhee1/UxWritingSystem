name: Keep Supabase Alive

# Supabase 무료 티어는 약 7일간 요청이 없으면 DB를 자동 일시정지(auto-pause)합니다.
# 이 워크플로는 매일 배포된 사이트를 호출해 DB 읽기를 발생시켜 pause를 방지합니다.
# (홈/voice 페이지는 force-dynamic으로 매 요청 시 DB를 조회함)

on:
  schedule:
    # 매일 UTC 03:00 (KST 12:00) 실행. 7일 pause 기준 대비 넉넉한 여유.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site to keep DB warm
        run: |
          SITE="https://ux-writing-system.vercel.app"
          echo "Pinging $SITE to keep Supabase DB active..."

          fail=0
          for path in "/" "/voice"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::warning::$path returned $code"
              fail=1
            fi
          done

          if [ "$fail" != "0" ]; then
            echo "::error::사이트가 정상 응답하지 않습니다. DB가 pause되었거나 배포에 문제가 있을 수 있습니다."
            exit 1
          fi

          echo "✓ 모든 경로 200 — DB 정상"
